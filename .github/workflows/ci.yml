# Tip: pin actions to full commit SHAs for supply-chain safety.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TYPST_VERSION: "0.13.1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      - name: Install Typst
        run: |
          dir="$RUNNER_TEMP/typst"
          mkdir -p "$dir"
          curl -sSfL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C "$dir" --strip-components=1
          echo "$dir" >> "$GITHUB_PATH"

      - name: Smoke test (compile the example invoice)
        run: |
          npm run smoke
          test -s build/smoke/invoices/2026/2026-12_invoice-1.pdf

      - uses: actions/upload-artifact@v7
        with:
          name: example-invoice
          path: build/smoke/invoices/
